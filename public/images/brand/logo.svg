<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none">
  <defs>
    <linearGradient id="tgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4b8b" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd166" />
      <stop offset="100%" stop-color="#ff4b8b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Sparkle Icon Crest -->
  <g transform="translate(10, 10)">
    <circle cx="20" cy="20" r="19" fill="url(#tgGrad)" fill-opacity="0.12" stroke="url(#tgGrad)" stroke-width="1.5" />
    <!-- 4-point star -->
    <path d="M20 7 C20 14 24 18 31 20 C24 22 20 26 20 33 C20 26 16 22 9 20 C16 18 20 14 20 7 Z" fill="url(#sparkleGrad)" filter="url(#glow)"/>
    <circle cx="28" cy="11" r="2" fill="#ffd166" />
    <circle cx="12" cy="28" r="1.5" fill="#a855f7" />
  </g>

  <!-- Typography -->
  <text x="62" y="31" font-family="'Outfit', 'Plus Jakarta Sans', -apple-system, sans-serif" font-weight="800" font-size="20" fill="currentColor" letter-spacing="-0.5">
    TeenGirls<tspan fill="url(#tgGrad)">.lk</tspan>
  </text>
  <text x="63" y="44" font-family="-apple-system, sans-serif" font-weight="600" font-size="8.5" fill="#94a3b8" letter-spacing="2">
    FASHION &amp; LIFESTYLE
  </text>
</svg>
